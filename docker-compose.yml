services:
  comic-metaphor-api:
    build: .
    ports:
      - "8100:8100"
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./processed:/app/processed
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
