apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: comic-metaphor-engine
    environment: production
    version: 2.0.0
  name: comic-metaphor-engine
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: comic-metaphor-engine
  template:
    metadata:
      labels:
        app: comic-metaphor-engine
        version: 2.0.0
    spec:
      containers:
      - env:
        - name: ENVIRONMENT
          value: production
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: database-url
              name: comic-metaphor-secrets
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              key: redis-url
              name: comic-metaphor-secrets
        image: comicmetaphor/engine:2.0.0
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: comic-metaphor-api
        ports:
        - containerPort: 8000
          protocol: TCP
        readinessProbe:
          failureThreshold: 1
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
